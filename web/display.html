<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Projection Mapper – Projector</title>
<link rel="icon" href="img/icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.hide-cursor { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #overlay { pointer-events: none; }
  #connect { position: fixed; display: none; align-items: center; gap: 4vh; background: rgba(12, 12, 20, .92);
    border: 1px solid rgba(255,255,255,.15); border-radius: 2.2vh; padding: 3.5vh 4vh; box-shadow: 0 2vh 6vh rgba(0,0,0,.6); }
  #connect.show { display: flex; }
  #connect.big { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #connect.corner { right: 3vh; bottom: 3vh; padding: 2vh; gap: 2.5vh; }
  #connect.corner #qr { width: 18vh; height: 18vh; }
  #connect.corner h1 { font-size: 2.6vh; }
  #connect.corner .steps { display: none; }
  #qr { flex: none; width: 38vh; height: 38vh; background: #fff; border-radius: 1.2vh; padding: 1.2vh; box-sizing: border-box; }
  #qr svg { width: 100%; height: 100%; display: block; }
  #connect h1 { font-size: 4.6vh; margin: 0 0 1.5vh; font-weight: 700; letter-spacing: -.02em; }
  #connect .url { font-size: 3vh; font-family: ui-monospace, Menlo, monospace; color: #7dd3fc; margin: 0 0 2vh; }
  #connect.corner .url { font-size: 2vh; margin: 0; }
  #connect ol { margin: 0; padding-left: 3.2vh; font-size: 2.5vh; line-height: 1.6; color: #cbd5e1; }
  #connect .hint { margin-top: 2vh; font-size: 2vh; color: #94a3b8; }
  #toast { position: fixed; left: 50%; top: 4vh; transform: translateX(-50%) translateY(-20vh); transition: transform .35s ease;
    background: rgba(12,12,20,.92); border: 1px solid rgba(255,255,255,.15); padding: 1.6vh 3vh; border-radius: 99vh; font-size: 2.6vh; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #err { position: fixed; left: 2vh; bottom: 2vh; font-size: 2vh; color: #fca5a5; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="overlay"></canvas>
<div id="connect">
  <div id="qr"></div>
  <div>
    <h1>Scan to start mapping</h1>
    <p class="url" id="url">…</p>
    <ol class="steps">
      <li>Connect your phone to the <b>same Wi‑Fi</b> as this projector</li>
      <li>Scan the code with the phone camera (or type the address)</li>
      <li>Add shapes and drag their corners onto your walls &amp; objects</li>
    </ol>
    <div class="hint steps">Press OK on the remote to show or hide this.</div>
  </div>
</div>
<div id="toast"></div>
<div id="err"></div>
<script src="js/vendor/qrcode.js"></script>
<script type="module" src="js/display.js"></script>
</body>
</html>
