name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (unit + browser end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e

  apk:
    name: Android TV app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK + desktop server jar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease :server:jar
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/projection-mapper.apk
          cp server/build/libs/server.jar ../dist/projection-mapper-server.jar
      - name: Verify the APK contents
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          unzip -l dist/projection-mapper.apk > apk.txt
          for f in assets/display.html assets/index.html assets/js/engine/renderer.js assets/js/vendor/qrcode.js classes.dex; do
            grep -q " $f\$" apk.txt || { echo "::error::APK is missing $f"; cat apk.txt; exit 1; }
          done
          "$BT"/aapt2 dump badging dist/projection-mapper.apk > badging.txt
          grep -E "^package:|sdkVersion|leanback-launchable-activity|banner=" badging.txt
          grep -q "leanback-launchable-activity" badging.txt || { echo "::error::no Android TV launcher entry"; exit 1; }
          grep -q "banner=" badging.txt || { echo "::error::no TV banner"; exit 1; }
          "$BT"/apksigner verify --print-certs dist/projection-mapper.apk | head -3
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: projection-mapper
          path: dist/

  release:
    name: Publish "latest" release
    needs: [test, apk]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: projection-mapper
          path: dist
      - name: Replace the "latest" release with this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Delete + recreate so the "latest" tag always points at this commit.
          # Retried because GitHub occasionally rejects a create right after a delete.
          for attempt in 1 2 3; do
            gh release delete latest --cleanup-tag -y || true
            sleep $((attempt * 5))
            if gh release create latest dist/projection-mapper.apk dist/projection-mapper-server.jar \
                --target "$GITHUB_SHA" \
                --title "Latest build (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
                --notes "Install **projection-mapper.apk** on your Google TV / Android TV projector. See the README for step-by-step install instructions. Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}."; then
              exit 0
            fi
            echo "release create failed (attempt $attempt), retrying..."
          done
          exit 1
